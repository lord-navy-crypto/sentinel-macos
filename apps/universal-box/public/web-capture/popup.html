<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Universal Box Web Capture</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
*{box-sizing:border-box}
body{width:410px;max-width:100%;margin:0;padding:16px;background:#f6f9fc;color:#18304b;font-size:13px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mark{display:grid;place-items:center;font-size:20px;font-weight:800;flex:0 0 43px;height:43px;border-radius:14px;background:linear-gradient(140deg,#0675b3,#00aeae);color:#fff}
h1{font-size:17px;margin:0 0 3px}.desc{color:#566981;font-size:11px;line-height:1.55;margin:0}
h2{font-size:12px;margin:0 0 11px}
.panel{background:#fff;border:1px solid #dbe5ee;border-radius:15px;padding:14px;margin-bottom:11px;box-shadow:0 3px 16px #193d5210}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-weight:650;cursor:pointer;border:1px solid #d1ddea;border-radius:10px;background:#eaf3fa;color:#154d76;padding:10px 8px;min-height:40px}
button.primary{background:#087bb1;color:#fff;border-color:#087bb1}
button:hover:not(:disabled){filter:brightness(.96);border-color:#0792bc}button:disabled{opacity:.56;cursor:wait}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ffad32;outline-offset:2px}
label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
select{width:100%;min-height:38px;border:1px solid #cbd8e4;background:#fff;color:#19344c;padding:7px 9px;border-radius:9px}
#tablePicker{margin-top:10px;padding:11px;border:1px solid #c8dce8;background:#f0f8fc;border-radius:10px}
#tablePicker[hidden]{display:none}
.table-notice{margin:9px 0 0;padding:10px;border:1px solid #d8b071;border-radius:9px;background:#fff3e2;color:#734818;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.table-notice[hidden]{display:none}
#status{font-size:12px;white-space:pre-wrap;min-height:22px;line-height:1.55;color:#225b79;margin:5px 0 10px}
#sourceMeta{font-size:11px;color:#586c7c;margin-bottom:7px;overflow-wrap:anywhere}
textarea{display:block;width:100%;height:156px;resize:vertical;border:1px solid #c4d5e4;border-radius:10px;background:#fff;color:#1b3447;padding:11px;font:12px/1.55 ui-monospace,"SFMono-Regular",monospace}
.note,.footer{color:#5d7085;font-size:11px;line-height:1.5;margin:8px 0 0}
</style></head><body>
<header><div class="mark" aria-hidden="true">U</div><div><h1>Web Capture <small>v0.3.1</small></h1>
<p class="desc">Universal Box · 只处理你点击授权的当前网页</p></div></header>
<section class="panel" aria-label="Capture text and Markdown"><h2>网页正文 / Markdown</h2><div class="actions">
<button data-mode="text" type="button">复制可见文字</button>
<button data-mode="markdown" type="button">复制 Markdown</button>
<button data-mode="markdown" data-save="true" class="primary" type="button">直接保存 Markdown</button>
<button data-mode="outline" type="button">提取标题大纲</button>
</div></section>
<section class="panel" aria-label="Capture links and HTML tables"><h2>链接 / 表格</h2><div class="actions">
<button data-mode="links" type="button">复制链接 CSV</button>
<button id="scanTables" type="button">查找所有表格</button>
<button data-mode="tables" type="button">复制所选表格 CSV</button>
<button data-mode="tables" data-save="true" class="primary" type="button">直接保存表格 CSV</button>
</div><div id="tablePicker" hidden><label for="tableSelect">选择要处理的 HTML 表格</label>
<select id="tableSelect" aria-label="Choose page table"></select>
<p class="note">最多检查前 24 个可见表格；含合并单元格的表格会提示无法无损导出。</p></div><p id="tableNotice" class="table-notice" role="alert" hidden></p></section>
<section class="panel" aria-label="Source and other tools"><h2>来源 / 其他操作</h2><div class="actions">
<button data-mode="source" type="button">复制标题和来源</button>
<button id="print" type="button">网页打印 / PDF</button></div></section>
<section class="panel" aria-label="Capture preview and save"><h2>捕获预览</h2>
<p id="status" role="status" aria-live="polite">选择一种提取操作开始。</p>
<p id="sourceMeta" aria-live="polite">尚未提取内容。</p>
<label for="preview">本机预览，可复制或下载</label>
<textarea id="preview" readonly spellcheck="false" aria-label="Extracted text preview"></textarea>
<div class="actions" style="margin-top:10px">
<button id="copyPreview" type="button">复制预览</button>
<button id="clean" type="button">整理文字</button>
<button id="save" class="primary" type="button">保存当前预览</button>
</div><p class="note">CSV 完整行导出并防止表格公式执行；不会截断 CSV 字段。下载由浏览器处理。</p></section>
<p class="footer">无账号 · 无后台监控 · 不上传数据 · 无额外站点权限。只访问当前授权标签页，部分浏览器保护页面不支持。</p>
<script src="popup.js"></script></body></html>
