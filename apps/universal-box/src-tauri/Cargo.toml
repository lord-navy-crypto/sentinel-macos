[package]
name = "daily-desk"
version = "0.29.0"
description = "Daily Desk study and productivity desktop application"
authors = ["Daily Desk contributors"]
edition = "2021"

[lib]
name = "daily_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
