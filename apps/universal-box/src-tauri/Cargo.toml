[package]
name = "daily-desk"
version = "0.36.0"
description = "Sentinel Box offline-first macOS productivity toolbox"
authors = ["Sentinel Box contributors"]
edition = "2021"

[lib]
name = "daily_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Embedded original Sentinel Go runtime: bounded authenticated localhost GET client and safe stop.
ureq = { version = "2.12", default-features = false }
libc = "0.2"
# Native pseudo-terminal from wezterm; no browser shell-execution permission granted.
portable-pty = "0.9.0"

# Authenticated, encrypted one-shot LAN handoff (no plaintext HTTP listener).
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
if-addrs = "0.13"

# Bonjour/mDNS advertising and browsing of opt-in active LAN shares.
mdns-sd = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
block = "0.1.6"
