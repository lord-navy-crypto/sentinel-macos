[package]
name = "daily-desk"
version = "0.30.1"
description = "Daily Desk study and productivity desktop application"
authors = ["Daily Desk contributors"]
edition = "2021"

[lib]
name = "daily_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Authenticated, encrypted one-shot LAN handoff (no plaintext HTTP listener).
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
if-addrs = "0.13"

# Bonjour/mDNS advertising and browsing of opt-in active LAN shares.
mdns-sd = "0.21"
