<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="sentinel-generation" content="2.6-native">
  <title>Sentinel 2.6 · Local Evidence</title>
  <link rel="stylesheet" href="/app/shell.css">
  <link rel="stylesheet" href="/app/advanced.css">
  <link rel="stylesheet" href="/app/workbench.css">
  <link rel="stylesheet" href="/app/full-scan.css">
  <link rel="stylesheet" href="/app/action-dock.css">
  <link rel="stylesheet" href="/app/ai.css">
  <link rel="stylesheet" href="/app/manual.css">
</head>
<body data-sentinel-generation="2.6-native">
  <div id="sentinel24" class="s24-shell">
    <header class="s24-command" aria-label="Sentinel command bar">
      <div class="s24-brand" aria-label="Sentinel 2.6">
        <span class="s24-mark" aria-hidden="true">S</span>
        <div><strong>Sentinel</strong><small id="productVersion">2.6</small></div>
      </div>
      <div class="s24-search" role="search">
        <label class="sr-only" for="globalSearch">Search local evidence</label>
        <input id="globalSearch" type="search" autocomplete="off" spellcheck="false" placeholder="Search or ask: process, path, endpoint, change, case…">
        <kbd>⌘K</kbd>
        <div id="searchResults" class="s24-search-results" hidden></div>
      </div>
      <div class="s24-command-actions">
        <span class="s24-local"><i></i>LOCAL</span>
        <button id="manualButton" class="s24-quiet" type="button" title="Open the complete Sentinel User Manual">Manual</button>
        <button id="refreshButton" class="s24-quiet" type="button">Refresh</button>
        <button id="exportButton" class="s24-quiet" type="button">Export</button>
      </div>
    </header>

    <nav id="missionRibbon" class="s24-missions" aria-label="Investigation intent"></nav>
    <nav id="lensRail" class="s24-lenses" aria-label="Evidence lens"></nav>

    <div id="systemNotice" class="s24-notice" role="status" aria-live="polite" hidden></div>

    <main id="evidenceStage" class="s24-stage" tabindex="-1" aria-live="polite">
      <div class="s24-boot">
        <span>LOCAL EVIDENCE WORKSPACE</span>
        <h1>Reading this Mac…</h1>
        <p>Sentinel is establishing the smallest useful current-state picture before asking you to interpret anything.</p>
      </div>
    </main>

    <aside id="contextTray" class="s24-context" aria-label="Selected evidence context" hidden>
      <div class="s24-context-head">
        <div><span>CONTEXT</span><strong id="contextTitle">Selected evidence</strong></div>
        <button id="contextClose" class="s24-icon" type="button" aria-label="Close context">×</button>
      </div>
      <div id="contextBody" class="s24-context-body"></div>
    </aside>

    <footer id="activityBar" class="s24-activity" aria-live="polite">
      <span id="activityState">Ready</span>
      <progress id="activityProgress" max="100" value="0"></progress>
      <span id="activityDetail">Local engine · no cloud dependency</span>
    </footer>
  </div>

  <script src="/app/core.js"></script>
  <script src="/app/lenses/orient-investigate.js"></script>
  <script src="/app/lenses/compare.js"></script>
  <script src="/app/lenses/system.js"></script>
  <script src="/app/lenses/act-limits.js"></script>
  <script src="/app/advanced.js"></script>
  <script src="/app/case-stories.js"></script>
  <script src="/app/system-evidence.js"></script>
  <script src="/app/workbench.js"></script>
  <script src="/app/full-scan.js"></script>
  <script src="/app/action-dock.js"></script>
  <script src="/app/ai.js"></script>
  <script>
  // Sentinel 2.6 Local AI Reliability Layer — fail visible, recover cleanly,
  // keep one Assistant entry point, and retain evidence-only fallback.
  (() => {
    'use strict';
    const S=window.SentinelApp, AI=S?.localAI;
    if(!S||!AI)return;
    const ai=AI.state, esc=S.esc||((v)=>String(v??''));
    const RELIABILITY_MARKER='Sentinel 2.6 Local AI Reliability';
    const STALL_MS=90000, ABSOLUTE_MS=600000;
    const reliability={lastError:'',lastFailureAt:0,lastSuccessAt:0,attempt:0,phase:'idle'};
    AI.reliability=reliability;AI.reliabilityMarker=RELIABILITY_MARKER;

    function capabilities(){
      return {
        webgpu:Boolean(navigator.gpu),worker:Boolean(window.Worker),indexeddb:Boolean(window.indexedDB),
        secureContext:Boolean(window.isSecureContext||location.hostname==='127.0.0.1'||location.hostname==='localhost')
      };
    }
    function modelName(){return AI.models?.find(x=>x.id===ai.model)?.name||ai.model||'—';}
    function diagnosticRows(){const c=capabilities();return [
      ['WebGPU',c.webgpu?'Available':'Unavailable'],['Worker',c.worker?'Available':'Unavailable'],
      ['IndexedDB',c.indexeddb?'Available':'Unavailable'],['Loopback / secure context',c.secureContext?'OK':'Review'],
      ['Selected model',modelName()],['Loaded model',ai.loadedModel||'Not loaded'],
      ['Worker state',ai.worker?'Created':'Not created'],['Engine state',ai.engine?'Created':'Not created'],
      ['Load phase',reliability.phase],['Progress',`${Math.round(Number(ai.progress||0)*100)}% · ${ai.progressText||'—'}`],
      ['Last error',reliability.lastError||'None']
    ];}
    function diagnosticsHTML(){return `<section id="aiReliabilityPanel" class="wb-section"><div class="wb-section-head"><div><h3>Local AI diagnostics</h3><p>Runtime → model download/cache → WebGPU initialization → generation. A stalled stage now fails visibly instead of waiting forever.</p></div></div><div class="s24-ledger">${diagnosticRows().map(([k,v])=>`<div><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div><div class="wb-actions"><button type="button" class="s24-action primary" data-ai-reliable="retry">Retry model load</button><button type="button" class="s24-action" data-ai-reliable="small">Use Qwen 0.5B</button><button type="button" class="s24-action" data-ai-reliable="refresh">Refresh diagnostics</button></div>${reliability.lastError?`<div class="s24-note warn"><b>Last Local AI failure:</b> ${esc(reliability.lastError)}. Sentinel evidence features remain available; use the evidence-only fallback below while troubleshooting the model.</div>`:''}<form id="aiEvidenceFallbackForm" class="wb-form"><label class="wb-field"><span>Evidence-only fallback</span><textarea name="prompt" rows="2" placeholder="What changed since my last checkpoint?"></textarea></label><button class="s24-action" type="submit">Analyze without model</button></form><div id="aiEvidenceFallbackResult"></div></section>`;}
    function ensureDiagnostics(){
      const stage=document.querySelector('#evidenceStage');if(!stage||S.state?.lens!=='assistant')return;
      let panel=stage.querySelector('#aiReliabilityPanel');
      if(!panel){const host=document.createElement('div');host.innerHTML=diagnosticsHTML();panel=host.firstElementChild;const q=stage.querySelector('.s24-question');if(q)q.insertAdjacentElement('afterend',panel);else stage.prepend(panel);}
      else{const fresh=document.createElement('div');fresh.innerHTML=diagnosticsHTML();panel.replaceWith(fresh.firstElementChild);}
    }
    function rebrandLegacyAssistant(){
      const tray=document.querySelector('#contextTray');if(!tray||tray.hidden||document.querySelector('#contextTitle')?.textContent!=='Investigation Workbench')return;
      for(const b of tray.querySelectorAll('[data-wb-tab="assistant"]')){b.textContent='Evidence fallback';b.title='Deterministic Sentinel API fallback; the model-backed assistant is the main Assistant Lens.';}
    }
    function queueUI(){queueMicrotask(()=>{ensureDiagnostics();rebrandLegacyAssistant();});}

    async function resetFailedLoad(message){
      reliability.lastError=String(message||'Unknown Local AI initialization error');reliability.lastFailureAt=Date.now();reliability.phase='failed';
      try{ai.worker?.terminate();}catch{};ai.worker=null;
      try{await ai.engine?.unload?.();}catch{};ai.engine=null;ai.loadedModel=null;ai.loading=false;ai.generating=false;
      ai.progressText='Local AI load failed · '+reliability.lastError;
      S.notice?.(ai.progressText);S.activity?.('Error',0,reliability.lastError);queueUI();
    }

    async function reliableLoad(){
      if(ai.loading)return;
      const c=capabilities();
      if(!c.worker||!c.indexeddb||!c.webgpu){await resetFailedLoad(`Prerequisite unavailable: ${!c.webgpu?'WebGPU ':''}${!c.worker?'Worker ':''}${!c.indexeddb?'IndexedDB ':''}`.trim());return;}
      const attempt=++reliability.attempt;reliability.lastError='';reliability.phase='runtime / model initialization';
      let lastProgress=Number(ai.progress||0),lastText=String(ai.progressText||''),lastChange=Date.now(),workerSeen=null,rejectWatchdog;
      const watchdog=new Promise((_,reject)=>{rejectWatchdog=reject;});
      const monitor=setInterval(()=>{
        if(attempt!==reliability.attempt)return;
        const p=Number(ai.progress||0),t=String(ai.progressText||'');
        if(p!==lastProgress||t!==lastText){lastProgress=p;lastText=t;lastChange=Date.now();reliability.phase=t||'model initialization';queueUI();}
        if(ai.worker&&ai.worker!==workerSeen){workerSeen=ai.worker;workerSeen.addEventListener('error',event=>rejectWatchdog(new Error(event.message||'Local AI worker bootstrap failed.')),{once:true});}
        if(Date.now()-lastChange>STALL_MS)rejectWatchdog(new Error(`Local AI initialization stalled for ${Math.round(STALL_MS/1000)} seconds at: ${t||'unknown stage'}`));
      },1000);
      const absolute=setTimeout(()=>rejectWatchdog(new Error('Local AI initialization exceeded the 10-minute safety limit.')),ABSOLUTE_MS);
      try{
        await Promise.race([AI.loadAI(),watchdog]);
        if(ai.engine&&ai.loadedModel){reliability.phase='ready';reliability.lastSuccessAt=Date.now();reliability.lastError='';S.activity?.('Ready',100,`Local AI ready · ${modelName()}`);}
        else throw new Error('Local AI loader returned without a ready engine.');
      }catch(error){await resetFailedLoad(error?.message||String(error));}
      finally{clearInterval(monitor);clearTimeout(absolute);queueUI();}
    }

    function renderFallback(answer){
      const out=document.querySelector('#aiEvidenceFallbackResult');if(!out)return;
      const section=(title,items)=>`<div class="s24-note"><b>${esc(title)}</b>${(items||[]).map(x=>`<p>${esc(x)}</p>`).join('')||'<p>None.</p>'}</div>`;
      out.innerHTML=section('Observed',answer?.observed)+section('Derived',answer?.derived)+section('Unknown',answer?.unknown)+section('Next',answer?.next);
    }
    async function fallback(question){
      if(!S.Workbench?.assistantAnswer)throw new Error('Evidence-only fallback is unavailable.');
      const answer=await S.Workbench.assistantAnswer(question);renderFallback(answer);return answer;
    }

    // Capture-phase routing prevents the original bubble handler from starting a
    // second model load. All model loads now pass through the reliability watchdog.
    document.addEventListener('click',event=>{
      const load=event.target.closest('[data-ai="load"]');
      if(load){event.preventDefault();event.stopImmediatePropagation();reliableLoad();return;}
      const control=event.target.closest('[data-ai-reliable]');if(!control)return;
      event.preventDefault();event.stopImmediatePropagation();
      if(control.dataset.aiReliable==='small'){ai.model='Qwen2.5-0.5B-Instruct-q4f16_1-MLC';localStorage.setItem('sentinel.ai.model',ai.model);ai.progressText='Qwen 2.5 0.5B selected for recovery testing.';queueUI();return;}
      if(control.dataset.aiReliable==='retry'){reliableLoad();return;}
      queueUI();
    },true);

    document.addEventListener('submit',event=>{
      if(event.target?.id==='aiEvidenceFallbackForm'){event.preventDefault();event.stopImmediatePropagation();const q=String(new FormData(event.target).get('prompt')||'').trim();if(q)fallback(q).catch(e=>{reliability.lastError=e.message;queueUI();});return;}
      // If the user asks before a model is ready, keep the single Assistant UX
      // useful by routing the question through bounded deterministic evidence.
      if(event.target?.id==='aiAskForm'&&!AI.isReady()){event.preventDefault();event.stopImmediatePropagation();const q=String(document.querySelector('#aiQuestion')?.value||'').trim();if(q){document.querySelector('#aiQuestion').value='';fallback(q).catch(e=>{reliability.lastError=e.message;queueUI();});}return;}
    },true);

    const stage=document.querySelector('#evidenceStage');if(stage)new MutationObserver(queueUI).observe(stage,{childList:true});
    const tray=document.querySelector('#contextTray');if(tray)new MutationObserver(queueUI).observe(tray,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden']});
    AI.reliableLoad=reliableLoad;AI.capabilityDiagnostics=capabilities;AI.evidenceFallback=fallback;
    queueUI();
  })();
  </script>
  <script src="/app/manual.js"></script>
  <script src="/app/manual-entry.js"></script>
  <script src="/app/runtime.js"></script>
</body>
</html>
