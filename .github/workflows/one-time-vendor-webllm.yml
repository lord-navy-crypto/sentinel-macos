name: One-time finalize vendored WebLLM

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Run WebLLM vendor finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply vendor finalizer
        run: python3 scripts/finalize_webllm_vendor.py
      - name: Format and validate patch
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w main.go local_ai_contract_test.go
          test -s web/vendor/webllm-0.2.82.mjs
          test "$(wc -c < web/vendor/webllm-0.2.82.mjs)" -gt 100000
          ! grep -R --line-number --fixed-strings 'https://esm.run/@mlc-ai/web-llm' web/app
          ! grep -R --line-number --fixed-strings 'https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm' web/app
          ! grep -Fq 'handleWebLLMRuntime' main.go
          grep -Fq '/vendor/webllm-0.2.82.mjs' web/app/ai.js
          grep -Fq "import('/vendor/webllm-0.2.82.mjs')" web/app/ai-worker.js
          grep -Fq 'web/vendor/webllm-0.2.82.mjs' build-desktop-macos.sh
      - name: Commit product cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A main.go webllm_runtime.go build-desktop-macos.sh local_ai_contract_test.go
          git commit -m 'Embed WebLLM runtime directly in Sentinel 2.6'
          git push origin HEAD:main
