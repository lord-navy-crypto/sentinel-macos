name: Universal Box Desktop CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/universal-box/**"
      - ".github/workflows/test-daily-desk.yml"
      - ".github/workflows/release-daily-desk.yml"
  pull_request:
    paths:
      - "apps/universal-box/**"
      - ".github/workflows/test-daily-desk.yml"
      - ".github/workflows/release-daily-desk.yml"
  workflow_dispatch:

concurrency:
  group: daily-desk-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    name: Type-check and build macOS DMG
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/universal-box
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go for bundled Sentinel service
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build original Sentinel Go engine into Tauri resources
        run: npm run prepare:sentinel

      - name: Check TypeScript and build frontend
        run: npm run build

      - name: Test transplanted everyday tools
        run: npm test

      - name: Smoke test bundled Go service handshake and API authentication
        run: python3 scripts/smoke-sentinel-service.py

      - name: Generate Tauri icons
        run: npx tauri icon src-tauri/app-icon.svg

      - name: Rust storage validation tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build macOS desktop bundle
        run: npm run tauri:build -- --target aarch64-apple-darwin

      - name: Verify DMG contains the original Sentinel Go engine
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_dir="$(mktemp -d)"
          cleanup() { hdiutil detach "$mount_dir" -quiet || true; rmdir "$mount_dir" || true; }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -quiet -mountpoint "$mount_dir" "$dmg"
          app_dir="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_dir"
          engine="$app_dir/Contents/Resources/sentinel/sentinel-engine"
          test -f "$engine"
          test -x "$engine"
          file "$engine"
          echo "Verified original Sentinel Go executable inside the DISTRIBUTED DMG"

      - name: Upload DMG for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: DailyDesk-macOS-AppleSilicon
          path: apps/universal-box/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
