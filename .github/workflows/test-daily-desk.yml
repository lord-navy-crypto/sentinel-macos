name: Sentinel Box Desktop CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/universal-box/**"
      - ".github/workflows/test-daily-desk.yml"
      - ".github/workflows/release-daily-desk.yml"
  pull_request:
    paths:
      - "apps/universal-box/**"
      - ".github/workflows/test-daily-desk.yml"
      - ".github/workflows/release-daily-desk.yml"
  workflow_dispatch:

concurrency:
  group: daily-desk-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS DMG (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      # Matrix-selected binary architecture, never silently bundle ARM Go in the Intel DMG.
      SENTINEL_TARGET_ARCH: ${{ matrix.target }}
    defaults:
      run:
        working-directory: apps/universal-box
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go for the original Sentinel engine
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install reproducible dependencies
        run: npm ci

      - name: Build and verify architecture-matched original Sentinel Go engine
        run: npm run prepare:sentinel

      - name: Check TypeScript and build frontend
        run: npm run build

      - name: Test transplanted everyday tools
        run: npm test

      - name: Smoke test original Go service token-authenticated loopback handshake
        run: python3 scripts/smoke-sentinel-service.py

      - name: Generate Tauri icons
        run: npx tauri icon src-tauri/app-icon.svg

      - name: Verify generated app icon assets
        run: |
          test -s src-tauri/icons/icon.icns
          test -s src-tauri/icons/128x128.png
          test -s src-tauri/icons/32x32.png

      - name: Rust storage validation tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Validate native release QA scripts
        run: |
          bash -n scripts/verify-macos-dmg.sh
          bash -n scripts/build-notarized-macos.sh

      - name: Build macOS desktop bundle
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Verify DMG opens and contains a launchable app with an icon
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG" && test -s "$DMG"
          hdiutil verify "$DMG"
          MOUNT="$RUNNER_TEMP/universal-box-mount-${{ matrix.target }}"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          APP="$MOUNT/Sentinel Box.app"
          test -d "$APP/Contents/MacOS"
          PLIST="$APP/Contents/Info.plist"
          test -s "$PLIST"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          ICON=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$PLIST")
          [[ "$ICON" == *.icns ]] || ICON="$ICON.icns"
          test -x "$APP/Contents/MacOS/$EXECUTABLE"
          test -s "$APP/Contents/Resources/$ICON"
          ENGINE="$APP/Contents/Resources/sentinel/sentinel-engine"
          test -x "$ENGINE"
          file "$ENGINE"
          file "$ENGINE" | grep -Eq "${{ matrix.target == 'aarch64-apple-darwin' && 'arm64|arm64e' || 'x86_64' }}"
          echo "Original Sentinel Go evidence engine bundled for ${{ matrix.target }}"

          # Ad-hoc signing is essential for local Apple Silicon builds,
          # but it is NOT Apple Developer ID notarization.
          codesign --verify --deep --strict --verbose=2 "$APP"
          SIGNATURE_DETAILS="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          echo "$SIGNATURE_DETAILS" | grep -F 'Signature=adhoc'
          echo "$SIGNATURE_DETAILS" | grep -F 'Identifier=com.lordnavycrypto.dailydesk'
          echo "Ad-hoc application signature verified for ${{ matrix.target }}"
          # Gatekeeper may still reject an unnotarized app downloaded from the Internet.
          # We deliberately do not mark this as a successful Apple notarization.
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST")" = "Sentinel Box"
          echo "Validated app executable: $EXECUTABLE"
          echo "Validated macOS app icon: $ICON"
          echo "Verified DMG and mounted application for ${{ matrix.target }}"
      - name: Verify DMG architecture and write artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          bash scripts/verify-macos-dmg.sh test "$DMG" "${{ matrix.target }}"
          # A controlled test artifact must NEVER pass the public-release gate.
          GUARD_LOG="$(mktemp)"
          if bash scripts/verify-macos-dmg.sh release "$DMG" "${{ matrix.target }}" > "$GUARD_LOG" 2>&1; then
            echo "SECURITY FAILURE: ad-hoc test DMG accepted by release verifier" >&2
            cat "$GUARD_LOG" >&2
            rm -f "$GUARD_LOG"
            exit 1
          fi
          if ! grep -Fq "RELEASE REFUSED: app is only ad-hoc signed." "$GUARD_LOG"; then
            echo "Unexpected release-verification failure; fail closed." >&2
            cat "$GUARD_LOG" >&2
            rm -f "$GUARD_LOG"
            exit 1
          fi
          rm -f "$GUARD_LOG"
          printf '%s  %s\n' "$(shasum -a 256 "$DMG" | awk '{print $1}')" "$(basename "$DMG")" > "$DMG.sha256"
          (cd "$(dirname "$DMG")" && shasum -a 256 -c "$(basename "$DMG").sha256")
          {
            echo "Sentinel Box TEST DMG — ad-hoc signed, NOT Apple notarized"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "architecture=${{ matrix.target }}"
            echo "artifact=$(basename "$DMG")"
            echo "sha256=$(shasum -a 256 "$DMG" | awk '{print $1}')"
          } > "$DMG.build.txt"

      - name: Upload DMG for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: SentinelBox-${{ matrix.target }}
          path: |
            apps/universal-box/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/universal-box/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg.sha256
            apps/universal-box/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg.build.txt
          if-no-files-found: error
          retention-days: 14
