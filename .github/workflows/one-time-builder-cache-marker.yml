name: One-time builder cache marker sync

on:
  push:
    branches:
      - sentinel-2.7-local-ai-cache-fix
    paths:
      - .github/workflows/one-time-builder-cache-marker.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-2.7-local-ai-cache-fix
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Sync builder cache marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-desktop-macos.sh')
          s=p.read_text()
          old="for marker in 'Model Library' 'useIndexedDBCache:true' 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC' 'Sentinel 2.7 Integrated Local AI'; do"
          new="for marker in 'Model Library' \"cacheBackend:'cache'\" 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC' 'Sentinel 2.7 Integrated Local AI'; do"
          if old not in s:
              raise SystemExit('expected legacy builder cache marker not found')
          s=s.replace(old,new,1)
          if 'useIndexedDBCache:true' in s:
              raise SystemExit('legacy IndexedDB flag remains in builder')
          p.write_text(s)
          PY
          git diff --check
          bash -n build-desktop-macos.sh
          grep -Fq "cacheBackend:'cache'" build-desktop-macos.sh
          ! grep -Fq 'useIndexedDBCache:true' build-desktop-macos.sh
      - name: Validate real desktop package
        run: |
          chmod +x build-desktop-macos.sh build-macos.sh
          ./build-desktop-macos.sh
          test -d dist/Sentinel.app
          test -x dist/Sentinel.app/Contents/MacOS/Sentinel
          test -x dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-arm64
          test -x dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-x86_64
          for engine in dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-arm64 dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-x86_64; do
            LC_ALL=C grep -aFq "cacheBackend:'cache'" "$engine"
          done
      - name: Commit builder sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-desktop-macos.sh
          git commit -m 'Sync desktop builder with Local AI Cache API'
          git push origin HEAD:sentinel-2.7-local-ai-cache-fix
