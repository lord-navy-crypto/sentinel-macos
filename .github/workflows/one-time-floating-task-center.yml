name: One-time Floating Task Center migration

on:
  push:
    branches:
      - sentinel-2.8-floating-task-center
    paths:
      - .github/workflows/one-time-floating-task-center.yml
      - tools/one_time_floating_task_center.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-2.8-floating-task-center
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Patch Floating Task Center
        run: python3 tools/one_time_floating_task_center.py
      - name: Validate source and contracts
        run: |
          git diff --check
          node --check web/app/task-center.js
          node --check web/app/lenses/system.js
          node --check web/app/full-scan.js
          grep -Fq 'Sentinel 2.7 Floating Task Center' web/app/task-center.js
          grep -Fq 'Possibly stalled' web/app/task-center.js
          grep -Fq 'Storage measurement' web/app/lenses/system.js
          grep -Fq "label: 'Full Scan'" web/app/full-scan.js
          go test ./... -run 'FloatingTaskCenter|Storage|FullScan|WorkGate|RuntimeLog'
          go vet ./...
      - name: Validate packaged Sentinel app
        run: |
          chmod +x build-desktop-macos.sh
          ./build-desktop-macos.sh
          test -d dist/Sentinel.app
          for engine in dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-arm64 dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-x86_64; do
            LC_ALL=C grep -aFq 'Sentinel 2.7 Floating Task Center' "$engine"
            LC_ALL=C grep -aFq 'Possibly stalled' "$engine"
            LC_ALL=C grep -aFq 'Progress cannot be measured for this operation.' "$engine"
            LC_ALL=C grep -aFq 'Storage measurement' "$engine"
          done
      - name: Commit validated product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/task-center.js web/app/task-center.css web/index.html web/app/lenses/system.js web/app/full-scan.js floating_task_center_contract_test.go
          git commit -m 'Add floating Task Center and measured progress'
          git push origin HEAD:sentinel-2.8-floating-task-center
