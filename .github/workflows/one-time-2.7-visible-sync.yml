name: One-time Sentinel 2.7 visible version sync

on:
  push:
    branches: [sentinel-2.7-visible-version-sync]
    paths:
      - .github/workflows/one-time-2.7-visible-sync.yml

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sentinel-2.7-visible-version-sync
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Synchronize current product markers to 2.7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              'desktop/SentinelDesktop.swift',
              'build-desktop-macos.sh',
              'reinstall-macos.sh',
              'web/index.html',
              'web/app/core.js',
              'web/app/ai.js',
              'main.go',
              'README.md',
              'desktop_conversion_test.go',
              'local_ai_contract_test.go',
              'web_handler_runtime_test.go',
              'web_wiring_test.go',
          ]
          replacements = {
              '2.6 Native Frontend': '2.7 Native Frontend',
              '2.6-native': '2.7-native',
              'Sentinel 2.6 Native Frontend': 'Sentinel 2.7 Native Frontend',
              'Sentinel 2.6 WebLLM Local AI': 'Sentinel 2.7 WebLLM Local AI',
              'same Sentinel 2.6 Native Frontend': 'same Sentinel 2.7 Native Frontend',
              'canonical Sentinel 2.6 frontend': 'canonical Sentinel 2.7 frontend',
              'Sentinel 2.6 includes': 'Sentinel 2.7 includes',
              'current Sentinel 2.6 product markers': 'current Sentinel 2.7 product markers',
              'modular Sentinel 2.6 application': 'modular Sentinel 2.7 application',
              '# Sentinel 2.6 — Local macOS System Intelligence': '# Sentinel 2.7 — Resilient Local Intelligence',
          }
          changed=[]
          for name in targets:
              p=Path(name)
              if not p.exists():
                  raise SystemExit(f'missing target {name}')
              s=p.read_text()
              before=s
              for old,new in replacements.items():
                  s=s.replace(old,new)
              if s!=before:
                  p.write_text(s)
                  changed.append(name)
          required = {
              'desktop/SentinelDesktop.swift':['2.7 Native Frontend'],
              'build-desktop-macos.sh':['2.7 Native Frontend'],
              'reinstall-macos.sh':['2.7 Native Frontend'],
              'web/index.html':['2.7-native'],
              'web/app/core.js':['Sentinel 2.7 Native Frontend'],
              'web/app/ai.js':['Sentinel 2.7 WebLLM Local AI'],
              'main.go':['2.7-native'],
              'README.md':['# Sentinel 2.7 — Resilient Local Intelligence'],
              'desktop_conversion_test.go':['2.7 Native Frontend','2.7-native','Sentinel 2.7 WebLLM Local AI'],
              'local_ai_contract_test.go':['Sentinel 2.7 WebLLM Local AI'],
              'web_handler_runtime_test.go':['2.7-native'],
              'web_wiring_test.go':['2.7-native','Sentinel 2.7 Native Frontend'],
          }
          for name,needles in required.items():
              s=Path(name).read_text()
              for needle in needles:
                  if needle not in s:
                      raise SystemExit(f'{name} missing {needle!r}')
          print('changed:', ', '.join(changed))
          PY
          gofmt -w desktop_conversion_test.go local_ai_contract_test.go web_handler_runtime_test.go web_wiring_test.go
          git diff --check
          go test ./...
          node --check web/app/core.js
          node --check web/app/ai.js
          bash -n build-desktop-macos.sh reinstall-macos.sh
          echo 'Residual current-runtime 2.6 markers:'
          grep -nR --include='*.go' --include='*.js' --include='*.html' --include='*.swift' --include='*.sh' '2\.6 Native Frontend\|2\.6-native\|Sentinel 2\.6 WebLLM Local AI' . --exclude-dir=.git && exit 1 || true
      - name: Commit verified 2.7 visible sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/SentinelDesktop.swift build-desktop-macos.sh reinstall-macos.sh web/index.html web/app/core.js web/app/ai.js main.go README.md desktop_conversion_test.go local_ai_contract_test.go web_handler_runtime_test.go web_wiring_test.go
          git diff --cached --quiet && exit 1
          git commit -m 'Synchronize Sentinel 2.7 visible runtime markers'
          git push origin HEAD:sentinel-2.7-visible-version-sync
