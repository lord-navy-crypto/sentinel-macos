name: One-time same-origin WebLLM bridge

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Install one-time same-origin WebLLM bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route WebLLM through Sentinel loopback origin
        shell: bash
        run: |
          set -euo pipefail
          REMOTE='https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.82/lib/index.js'
          LOCAL='/vendor/webllm-0.2.82.mjs'
          perl -0pi -e 's#https://cdn\.jsdelivr\.net/npm/\@mlc-ai/web-llm\@0\.2\.82/lib/index\.js#/vendor/webllm-0.2.82.mjs#g' web/app/ai.js web/app/ai-worker.js
          perl -0pi -e 's#\t// Sentinel 2\.6 serves#\tmux.HandleFunc(webLLMRuntimePath, a.handleWebLLMRuntime)\n\n\t// Sentinel 2.6 serves#' main.go
          perl -0pi -e "s#script-src 'self' 'wasm-unsafe-eval' https://cdn\.jsdelivr\.net;#script-src 'self' 'wasm-unsafe-eval';#g; s#connect-src 'self' https://cdn\.jsdelivr\.net #connect-src 'self' #g" main.go
          grep -Fq "const WEBLLM_URL = '$LOCAL';" web/app/ai.js
          grep -Fq "import('$LOCAL')" web/app/ai-worker.js
          grep -Fq 'mux.HandleFunc(webLLMRuntimePath, a.handleWebLLMRuntime)' main.go
          test -z "$(grep -F 'https://cdn.jsdelivr.net' web/app/ai.js web/app/ai-worker.js main.go || true)"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/ai.js web/app/ai-worker.js main.go
          git commit -m 'Route WebLLM through same-origin loopback bridge'
          git push origin HEAD:main
