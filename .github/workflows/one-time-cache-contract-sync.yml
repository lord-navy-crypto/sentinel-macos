name: One-time cache contract sync

on:
  push:
    branches:
      - sentinel-2.7-local-ai-cache-fix
    paths:
      - .github/workflows/one-time-cache-contract-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-2.7-local-ai-cache-fix
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Sync cache contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'desktop_conversion_test.go': [
                  ('useIndexedDBCache:true', "cacheBackend:'cache'"),
                  ('WebLLM IndexedDB model cache', 'WebLLM persistent model cache'),
              ],
              'local_ai_contract_test.go': [
                  ('"useIndexedDBCache:true",', '"cacheBackend:\'cache\'",'),
                  ('if strings.Contains(ai, "cacheBackend:\'indexeddb\'") {\n\t\tt.Fatal("WebLLM 0.2.82 must use useIndexedDBCache:true instead of the newer cacheBackend API")\n\t}', 'if strings.Contains(ai, "useIndexedDBCache:true") {\n\t\tt.Fatal("Local AI must use the explicit Cache API backend instead of the retired IndexedDB flag")\n\t}'),
                  ('WebLLM IndexedDB model cache survives relaunch', 'WebLLM persistent model cache survives relaunch'),
              ],
              '.github/workflows/ci.yml': [
                  ("grep -aFq 'useIndexedDBCache:true'", "grep -aFq \"cacheBackend:'cache'\""),
                  ('grep -Fq "useIndexedDBCache:true" web/app/ai.js', 'grep -Fq "cacheBackend:\'cache\'" web/app/ai.js'),
              ],
          }
          for name, pairs in replacements.items():
              p = Path(name)
              s = p.read_text()
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f'missing expected text in {name}: {old}')
                  s = s.replace(old, new)
              p.write_text(s)
          PY
          git diff --check
          grep -Fq "cacheBackend:'cache'" desktop_conversion_test.go
          grep -Fq "cacheBackend:'cache'" local_ai_contract_test.go
          grep -Fq "cacheBackend:'cache'" .github/workflows/ci.yml
          ! grep -Fq 'useIndexedDBCache:true' desktop_conversion_test.go
          ! grep -Fq 'useIndexedDBCache:true' local_ai_contract_test.go
          ! grep -Fq 'useIndexedDBCache:true' .github/workflows/ci.yml
      - name: Validate
        run: |
          go test ./...
          go vet ./...
          node --check web/app/ai.js
          node --check web/app/ai-reliability.js
      - name: Commit synced contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop_conversion_test.go local_ai_contract_test.go .github/workflows/ci.yml
          git commit -m 'Sync Local AI cache contracts with Cache API'
          git push origin HEAD:sentinel-2.7-local-ai-cache-fix
