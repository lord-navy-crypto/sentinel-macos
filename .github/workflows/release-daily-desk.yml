name: Universal Box macOS Release

on:
  push:
    tags:
      - "daily-desk-v*"
      - "universal-box-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build DMG (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    defaults:
      run:
        working-directory: apps/universal-box
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend and test
        run: |
          npm run build
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generate Tauri icons
        run: npx tauri icon src-tauri/app-icon.svg
      - name: Verify generated app icon assets
        run: |
          test -s src-tauri/icons/icon.icns
          test -s src-tauri/icons/128x128.png
          test -s src-tauri/icons/32x32.png
      - name: Build and bundle macOS DMG
        run: npm run tauri:build -- --target ${{ matrix.target }}
      - name: Verify DMG opens and contains a launchable app with an icon
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG" && test -s "$DMG"
          hdiutil verify "$DMG"
          MOUNT="$RUNNER_TEMP/universal-box-mount-${{ matrix.target }}"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          APP="$MOUNT/Universal Box.app"
          test -d "$APP/Contents/MacOS"
          PLIST="$APP/Contents/Info.plist"
          test -s "$PLIST"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          ICON=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$PLIST")
          [[ "$ICON" == *.icns ]] || ICON="$ICON.icns"
          test -x "$APP/Contents/MacOS/$EXECUTABLE"
          test -s "$APP/Contents/Resources/$ICON"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST")" = "Universal Box" || true
          echo "Validated app executable: $EXECUTABLE"
          echo "Validated macOS app icon: $ICON"
          echo "Verified DMG and mounted application for ${{ matrix.target }}"
      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalBox-${{ matrix.target }}
          path: apps/universal-box/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish versioned GitHub Release
    if: startsWith(github.ref, 'refs/tags/daily-desk-v') || startsWith(github.ref, 'refs/tags/universal-box-v')
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download both validated DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: UniversalBox-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.dmg
          fail_on_unmatched_files: true
