name: Sentinel Box macOS Release

on:
  push:
    tags:
      - "daily-desk-v*"
      - "universal-box-v*"
      - "sentinel-box-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-source:
    name: Verify tag, app version and release identity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/universal-box
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify all four app versions and the release tag
        run: node scripts/release-preflight.cjs
      - name: Unit test offline release validation
        run: node --test test/release-preflight.test.cjs

  build-macos:
    needs: verify-release-source
    name: Build DMG (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    defaults:
      run:
        working-directory: apps/universal-box
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend and test
        run: |
          npm run build
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generate Tauri icons
        run: npx tauri icon src-tauri/app-icon.svg
      - name: Verify generated app icon assets
        run: |
          test -s src-tauri/icons/icon.icns
          test -s src-tauri/icons/128x128.png
          test -s src-tauri/icons/32x32.png
      - name: Build and bundle macOS DMG
        run: npm run tauri:build -- --target ${{ matrix.target }}
      - name: Verify DMG opens and contains a launchable app with an icon
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG" && test -s "$DMG"
          hdiutil verify "$DMG"
          MOUNT="$RUNNER_TEMP/universal-box-mount-${{ matrix.target }}"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          APP="$MOUNT/Sentinel Box.app"
          test -d "$APP/Contents/MacOS"
          PLIST="$APP/Contents/Info.plist"
          test -s "$PLIST"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          ICON=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$PLIST")
          [[ "$ICON" == *.icns ]] || ICON="$ICON.icns"
          test -x "$APP/Contents/MacOS/$EXECUTABLE"
          test -s "$APP/Contents/Resources/$ICON"
          # Ad-hoc signing is essential for local Apple Silicon builds,
          # but it is NOT Apple Developer ID notarization.
          codesign --verify --deep --strict --verbose=2 "$APP"
          SIGNATURE_DETAILS="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          echo "$SIGNATURE_DETAILS" | grep -F 'Signature=adhoc'
          echo "$SIGNATURE_DETAILS" | grep -F 'Identifier=com.lordnavycrypto.dailydesk'
          echo "Ad-hoc application signature verified for ${{ matrix.target }}"
          # Gatekeeper may still reject an unnotarized app downloaded from the Internet.
          # We deliberately do not mark this as a successful Apple notarization.
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST")" = "Sentinel Box"
          echo "Validated app executable: $EXECUTABLE"
          echo "Validated macOS app icon: $ICON"
          echo "Verified DMG and mounted application for ${{ matrix.target }}"
      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelBox-${{ matrix.target }}
          path: apps/universal-box/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish versioned GitHub Release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/daily-desk-v') || startsWith(github.ref, 'refs/tags/universal-box-v') || startsWith(github.ref, 'refs/tags/sentinel-box-v')
    needs: [verify-release-source, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download both validated DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: SentinelBox-*
          path: release
          merge-multiple: true
      - name: Verify both architectures and create release checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          if [[ "${#dmgs[@]}" -ne 2 ]]; then
            echo "::error::Expected exactly 2 validated macOS DMG artifacts (Intel + Apple Silicon), got ${#dmgs[@]}."
            exit 1
          fi
          (cd release && sha256sum ./*.dmg > SHA256SUMS.txt)
          (cd release && sha256sum -c SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
      - name: Publish draft GitHub Release for final macOS review
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.dmg
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
