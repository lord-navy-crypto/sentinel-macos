name: Universal Box macOS Release

on:
  push:
    tags:
      - "daily-desk-v*"
      - "universal-box-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build DMG (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    defaults:
      run:
        working-directory: apps/universal-box
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend and test
        run: |
          npm run build
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generate Tauri icons
        run: npx tauri icon src-tauri/app-icon.svg
      - name: Build and bundle macOS DMG
        run: npm run tauri:build -- --target ${{ matrix.target }}
      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalBox-${{ matrix.target }}
          path: apps/universal-box/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish versioned GitHub Release
    if: startsWith(github.ref, 'refs/tags/daily-desk-v') || startsWith(github.ref, 'refs/tags/universal-box-v')
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download both validated DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: UniversalBox-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.dmg
          fail_on_unmatched_files: true
