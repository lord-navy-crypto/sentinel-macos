name: One-time P1 hardening

on:
  push:
    branches: [sentinel-2.6-hardening-20260831]
    paths:
      - tools/one_time_p1_hardening.py
      - .github/workflows/one-time-p1-hardening.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sentinel-2.6-hardening-20260831
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Apply guarded patch
        run: python3 tools/one_time_p1_hardening.py
      - name: Format and verify
        run: |
          gofmt -w advanced.go actions.go trust.go change_monitor.go incidents.go p1_hardening_contract_test.go
          git diff --check
          go test ./...
          node --check web/app/core.js
          node --check web/app/full-scan.js
      - name: Commit verified hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add advanced.go actions.go trust.go change_monitor.go incidents.go web/app/core.js web/app/full-scan.js p1_hardening_contract_test.go
          git diff --cached --quiet && exit 1
          git commit -m 'Close Sentinel 2.6 remaining P1 hardening gaps'
          git push origin HEAD:sentinel-2.6-hardening-20260831
