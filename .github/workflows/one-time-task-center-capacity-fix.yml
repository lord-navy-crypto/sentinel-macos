name: One-time Task Center capacity fix

on:
  push:
    branches:
      - sentinel-2.8-floating-task-center
    paths:
      - .github/workflows/one-time-task-center-capacity-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-2.8-floating-task-center
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Make capacity rejection terminal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/app/task-center.js')
          s=p.read_text()
          old="t.visible=true;t.status='queued';t.detail='Sentinel is busy with other expensive local analysis. This request was not started.';t.finishedAt=now();t.finishedLabel=elapsed(t.finishedAt-t.startedAt);render();"
          new="t.visible=true;t.status='failed';t.detail='Capacity limited · Sentinel is busy with other expensive local analysis. This request was not started.';t.finishedAt=now();t.lastUpdate=t.finishedAt;t.finishedLabel=elapsed(t.finishedAt-t.startedAt);render();"
          if old not in s:
              raise SystemExit('capacity-state anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate
        run: |
          git diff --check
          node --check web/app/task-center.js
          grep -Fq 'Capacity limited' web/app/task-center.js
          go test ./... -run 'FloatingTaskCenter|WorkGate|Storage|FullScan'
          go vet ./...
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/task-center.js
          git commit -m 'Make Task Center capacity rejection terminal'
          git push origin HEAD:sentinel-2.8-floating-task-center
