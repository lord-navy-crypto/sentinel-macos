name: One-time Local AI scope fix

on:
  push:
    branches:
      - sentinel-2.7-fix-ai-state-scope
    paths:
      - .github/workflows/one-time-fix-ai-scope.yml
      - tools/one_time_fix_ai_scope.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-2.7-fix-ai-state-scope
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Patch Local AI state scope
        run: python3 tools/one_time_fix_ai_scope.py
      - name: Validate scope fix
        run: |
          git diff --check
          node --check web/app/ai.js
          ! grep -Fq 'AI.executionBackend' web/app/ai.js
          ! grep -Fq 'AI.cacheBackend' web/app/ai.js
          grep -Fq "executionBackend:'pending',cacheBackend:'pending'" web/app/ai.js
          grep -Fq 'ai.executionBackend' web/app/ai.js
          grep -Fq 'ai.cacheBackend' web/app/ai.js
          go test ./... -run 'LocalAI|RuntimeLog|Application'
      - name: Commit product fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/ai.js
          git commit -m 'Fix Local AI runtime state scope'
          git push origin HEAD:sentinel-2.7-fix-ai-state-scope
