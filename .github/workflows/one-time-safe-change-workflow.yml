name: One-time Safe Change workflow migration

on:
  push:
    branches:
      - sentinel-2.8-safe-change-workflow
    paths:
      - .github/workflows/one-time-safe-change-workflow.yml
      - tools/one_time_safe_change_workflow.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-2.8-safe-change-workflow
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Patch Safe Change workflow
        run: python3 tools/one_time_safe_change_workflow.py
      - name: Validate source and contracts
        run: |
          git diff --check
          node --check web/app/lenses/act-limits.js
          node --check web/app/runtime-logs.js
          grep -Fq 'Sentinel 2.7 Safe Change Workflow' web/app/lenses/act-limits.js
          grep -Fq 'previewFreshnessText' web/app/lenses/act-limits.js
          grep -Fq 'Review in Safe Change' web/app/lenses/act-limits.js
          grep -Fq "previewActionRequest({action:'restore'" web/app/lenses/act-limits.js
          grep -Fq '<option value="action">action</option>' web/app/runtime-logs.js
          go test ./... -run 'SafeChange|Action|Vault|RuntimeLog|Storage'
          go vet ./...
      - name: Validate packaged Sentinel app
        run: |
          chmod +x build-desktop-macos.sh
          ./build-desktop-macos.sh
          test -d dist/Sentinel.app
          for engine in dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-arm64 dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-x86_64; do
            LC_ALL=C grep -aFq 'Sentinel 2.7 Safe Change Workflow' "$engine"
            LC_ALL=C grep -aFq 'Review in Safe Change' "$engine"
            LC_ALL=C grep -aFq 'This preview has expired. Create a fresh preview first.' "$engine"
            LC_ALL=C grep -aFq 'Recovery journal refreshed' "$engine"
          done
      - name: Commit validated product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/lenses/act-limits.js web/app/runtime-logs.js safe_change_workflow_contract_test.go
          git commit -m 'Deepen Safe Change and recovery workflow'
          git push origin HEAD:sentinel-2.8-safe-change-workflow
