name: Read-only Pull Request Stack Audit

on:
  pull_request:
    paths:
      - ".github/scripts/pr-stack-audit.cjs"
      - ".github/scripts/pr-stack-audit.node.cjs"
      - ".github/workflows/pr-stack-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test-audit-parser:
    name: Test dependency graph and pagination logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run isolated Node regression tests
        run: node --test .github/scripts/pr-stack-audit.node.cjs

  audit-open-pull-requests:
    name: Generate current review-order report
    if: github.event_name == 'workflow_dispatch'
    needs: test-audit-parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read current open PR base/head chain, no mutations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node .github/scripts/pr-stack-audit.cjs --out pr-stack-audit.json | tee pr-stack-audit-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr-stack-audit
          path: |
            pr-stack-audit.json
            pr-stack-audit-summary.txt
          if-no-files-found: error
          retention-days: 14
