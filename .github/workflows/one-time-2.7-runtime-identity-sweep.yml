name: One-time Sentinel 2.7 runtime identity sweep

on:
  push:
    branches: [sentinel-2.7-visible-version-sync]
    paths:
      - .github/workflows/one-time-2.7-runtime-identity-sweep.yml

permissions:
  contents: write

jobs:
  sweep-and-verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sentinel-2.7-visible-version-sync
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Sweep current runtime identity to 2.7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = []
          files += [p for p in Path('web').rglob('*.js') if p.is_file()]
          files += [Path('web/index.html'), Path('main.go'), Path('desktop/SentinelDesktop.swift')]
          files += [Path(x) for x in ['build-desktop-macos.sh','reinstall-macos.sh','verify-release-macos.sh','SMOKE_TEST_LOCALHOST.command','README.md']]
          files += list(Path('.').glob('*test.go'))
          replacements = [
              ('Sentinel 2.6', 'Sentinel 2.7'),
              ('2.6-native', '2.7-native'),
              ('__SENTINEL_26__', '__SENTINEL_27__'),
              ('sentinel-26', 'sentinel-27'),
          ]
          changed=[]
          for p in files:
              if not p.exists():
                  raise SystemExit(f'missing {p}')
              s=p.read_text(); before=s
              for old,new in replacements:
                  s=s.replace(old,new)
              if s!=before:
                  p.write_text(s); changed.append(str(p))
          must = {
              'web/index.html':['2.7-native'],
              'main.go':['2.7-native'],
              'web/app/core.js':['Sentinel 2.7 Native Frontend'],
              'web/app/ai.js':['Sentinel 2.7 WebLLM Local AI'],
              'web/app/workbench.js':['Sentinel 2.7 Investigation Workbench'],
              'web/app/full-scan.js':['Sentinel 2.7 Full Scan Center'],
              'web/app/action-dock.js':['Sentinel 2.7 Contextual Action Dock'],
              'web/app/ai-reliability.js':['Sentinel 2.7 Local AI Reliability'],
              'web/app/manual.js':['Sentinel 2.7 Comprehensive User Manual'],
              'web/app/runtime.js':['__SENTINEL_27__'],
              'web/aux-navigation.js':['Sentinel 2.7 · AUX'],
              'SMOKE_TEST_LOCALHOST.command':['Sentinel 2.7 localhost functional smoke test','2.7-native','Sentinel 2.7 WebLLM Local AI','__SENTINEL_27__'],
          }
          for name,needles in must.items():
              s=Path(name).read_text()
              for needle in needles:
                  if needle not in s: raise SystemExit(f'{name} missing {needle!r}')
          print('changed files:', len(changed))
          print('\n'.join(changed))
          PY
          gofmt -w *.go
          git diff --check
          go test ./...
          ./SMOKE_TEST_LOCALHOST.command
          find web -name '*.js' -print0 | xargs -0 -n1 node --check
          bash -n build-desktop-macos.sh reinstall-macos.sh verify-release-macos.sh SMOKE_TEST_LOCALHOST.command
          echo 'Residual CURRENT runtime 2.6 identity markers:'
          if grep -nR --include='*.js' --include='*.html' --include='*.go' --include='*.swift' --include='*.sh' --include='*.command' 'Sentinel 2\.6\|2\.6-native\|__SENTINEL_26__' web main.go desktop build-desktop-macos.sh reinstall-macos.sh verify-release-macos.sh SMOKE_TEST_LOCALHOST.command ./*test.go 2>/dev/null; then
            exit 1
          fi
      - name: Commit verified runtime identity sweep
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web main.go desktop/SentinelDesktop.swift build-desktop-macos.sh reinstall-macos.sh verify-release-macos.sh SMOKE_TEST_LOCALHOST.command README.md ./*test.go
          git diff --cached --quiet && exit 1
          git commit -m 'Finish Sentinel 2.7 runtime identity migration'
          git push origin HEAD:sentinel-2.7-visible-version-sync
