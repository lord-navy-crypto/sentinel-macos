name: One-time Sentinel 2.7 local diagnostics log

on:
  push:
    branches: [sentinel-2.7-local-ai-cache-fix]
    paths:
      - .github/workflows/one-time-local-diagnostics-log.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-2.7-local-ai-cache-fix
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Add local diagnostics logging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/app/ai-reliability.js')
          s=p.read_text()
          anchor="const reliability={lastError:'',lastFailureAt:0,lastSuccessAt:0,attempt:0,phase:'idle',generationStartedAt:0,lastTokenAt:0};\n  AI.reliability=reliability;AI.reliabilityMarker=RELIABILITY_MARKER;"
          insert="""const reliability={lastError:'',lastFailureAt:0,lastSuccessAt:0,attempt:0,phase:'idle',generationStartedAt:0,lastTokenAt:0};
  AI.reliability=reliability;AI.reliabilityMarker=RELIABILITY_MARKER;

  const LOG_KEY='sentinel.diagnostics.log.v1', LOG_LIMIT=400;
  const SENSITIVE_LOG_KEY=/(prompt|question|path|content|token|secret|message|conversation|command)/i;
  function readLog(){try{const v=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');return Array.isArray(v)?v:[];}catch{return [];}}
  function safeLogMeta(meta={}){const out={};for(const [k,v] of Object.entries(meta||{})){if(SENSITIVE_LOG_KEY.test(k))continue;if(['string','number','boolean'].includes(typeof v))out[k]=typeof v==='string'?v.slice(0,160):v;}return out;}
  function logEvent(event,meta={}){try{const rows=readLog();rows.push({at:new Date().toISOString(),event:String(event||'event').slice(0,80),...safeLogMeta(meta)});localStorage.setItem(LOG_KEY,JSON.stringify(rows.slice(-LOG_LIMIT)));}catch{}}
  function exportLog(){return JSON.stringify({product:'Sentinel 2.7',generated_at:new Date().toISOString(),privacy:'Local-only diagnostics. User prompts/content/paths/tokens are intentionally excluded.',entries:readLog()},null,2);}
  function clearLog(){try{localStorage.removeItem(LOG_KEY);}catch{}}
  S.diagnosticsLog={record:logEvent,read:readLog,export:exportLog,clear:clearLog};
  logEvent('session_start',{lens:S.state?.lens||'unknown',cache_backend:AI.cacheBackend||'cache'});"""
          if anchor not in s: raise SystemExit('diagnostics anchor missing')
          s=s.replace(anchor,insert,1)

          old="['Load / generation phase',reliability.phase],['Progress',`${Math.round(Number(ai.progress||0)*100)}% · ${ai.progressText||'—'}`],"
          new="['Load / generation phase',reliability.phase],['Diagnostics log',`${readLog().length} local events`],['Progress',`${Math.round(Number(ai.progress||0)*100)}% · ${ai.progressText||'—'}`],"
          if old not in s: raise SystemExit('diagnostics row anchor missing')
          s=s.replace(old,new,1)

          oldbtn='<button type="button" class="s24-action" data-ai-reliable="refresh">Refresh diagnostics</button>'
          newbtn=oldbtn+'<button type="button" class="s24-action" data-ai-reliable="copy-log">Copy diagnostics log</button><button type="button" class="s24-action" data-ai-reliable="clear-log">Clear log</button>'
          if oldbtn not in s: raise SystemExit('diagnostic button anchor missing')
          s=s.replace(oldbtn,newbtn,1)

          oldload="const attempt=++reliability.attempt;reliability.lastError='';reliability.phase='runtime / model initialization';"
          newload=oldload+"logEvent('ai_load_start',{model:ai.model,attempt,cache_backend:AI.cacheBackend||'cache'});"
          if oldload not in s: raise SystemExit('load start anchor missing')
          s=s.replace(oldload,newload,1)

          oldchange="if(p!==lastProgress||t!==lastText){lastProgress=p;lastText=t;lastChange=Date.now();reliability.phase=t||'model initialization';queueUI();}"
          newchange="if(p!==lastProgress||t!==lastText){lastProgress=p;lastText=t;lastChange=Date.now();reliability.phase=t||'model initialization';logEvent('ai_load_progress',{model:ai.model,progress:Math.round(p*100),phase:(t||'model initialization').slice(0,160),cache_backend:AI.cacheBackend||'cache'});queueUI();}"
          if oldchange not in s: raise SystemExit('progress anchor missing')
          s=s.replace(oldchange,newchange,1)

          oldfail="reliability.lastError=String(message||'Unknown Local AI initialization error');reliability.lastFailureAt=Date.now();reliability.phase='failed';"
          newfail=oldfail+"logEvent('ai_load_failed',{model:ai.model,phase:reliability.phase,error_kind:reliability.lastError.slice(0,160),cache_backend:AI.cacheBackend||'cache'});"
          if oldfail not in s: raise SystemExit('failure anchor missing')
          s=s.replace(oldfail,newfail,1)

          oldready="if(ai.engine&&ai.loadedModel){reliability.phase='ready';reliability.lastSuccessAt=Date.now();reliability.lastError='';S.activity?.('Ready',100,`Local AI ready · ${modelName()}`);}"
          newready="if(ai.engine&&ai.loadedModel){reliability.phase='ready';reliability.lastSuccessAt=Date.now();reliability.lastError='';logEvent('ai_load_ready',{model:ai.loadedModel,cache_backend:AI.cacheBackend||'cache'});S.activity?.('Ready',100,`Local AI ready · ${modelName()}`);}"
          if oldready not in s: raise SystemExit('ready anchor missing')
          s=s.replace(oldready,newready,1)

          oldsmall="if(control.dataset.aiReliable==='small'){ai.model='Qwen2.5-0.5B-Instruct-q4f16_1-MLC';localStorage.setItem('sentinel.ai.model',ai.model);ai.progressText='Qwen 2.5 0.5B selected for recovery testing.';queueUI();return;}"
          newsmall="if(control.dataset.aiReliable==='small'){ai.model='Qwen2.5-0.5B-Instruct-q4f16_1-MLC';localStorage.setItem('sentinel.ai.model',ai.model);ai.progressText='Qwen 2.5 0.5B selected for recovery testing.';logEvent('ai_model_selected',{model:ai.model,source:'recovery'});queueUI();return;}"
          if oldsmall not in s: raise SystemExit('small model anchor missing')
          s=s.replace(oldsmall,newsmall,1)

          oldretry="if(control.dataset.aiReliable==='retry'){void reliableLoad();return;}\n    queueUI();"
          newretry="if(control.dataset.aiReliable==='retry'){logEvent('ai_retry',{model:ai.model});void reliableLoad();return;}\n    if(control.dataset.aiReliable==='copy-log'){navigator.clipboard?.writeText(exportLog()).then(()=>S.notice?.('Local diagnostics log copied.')).catch(()=>S.notice?.('Could not copy diagnostics log.'));return;}\n    if(control.dataset.aiReliable==='clear-log'){clearLog();logEvent('diagnostics_log_cleared',{});queueUI();return;}\n    queueUI();"
          if oldretry not in s: raise SystemExit('reliable controls anchor missing')
          s=s.replace(oldretry,newretry,1)

          hook="const stage=document.querySelector('#evidenceStage');if(stage)new MutationObserver(queueUI).observe(stage,{childList:true});"
          hooknew="document.addEventListener('click',event=>{const b=event.target.closest?.('button');if(!b)return;const action=b.dataset?.ai||b.dataset?.aiReliable||b.dataset?.aiTool||b.dataset?.aiContext||b.dataset?.action||b.id||'';if(action)logEvent('ui_action',{action:String(action).slice(0,80),lens:S.state?.lens||'unknown'});},true);\n  "+hook
          if hook not in s: raise SystemExit('global usage hook anchor missing')
          s=s.replace(hook,hooknew,1)
          p.write_text(s)
          PY
          git diff --check
          node --check web/app/ai-reliability.js
          grep -Fq "sentinel.diagnostics.log.v1" web/app/ai-reliability.js
          grep -Fq 'Copy diagnostics log' web/app/ai-reliability.js
          grep -Fq "ai_load_progress" web/app/ai-reliability.js
          grep -Fq 'SENSITIVE_LOG_KEY' web/app/ai-reliability.js
      - name: Validate
        run: |
          go test ./...
          go vet ./...
          bash -n SMOKE_TEST_LOCALHOST.command
          ./SMOKE_TEST_LOCALHOST.command
      - name: Commit production change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/ai-reliability.js
          git diff --cached --quiet && { echo 'No diagnostics change'; exit 1; }
          git commit -m 'Add local background diagnostics logging'
          git push origin HEAD:sentinel-2.7-local-ai-cache-fix
