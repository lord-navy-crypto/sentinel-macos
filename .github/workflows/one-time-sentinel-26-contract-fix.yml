name: One-time Sentinel 2.6 contract fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Install one-time Sentinel 2.6 contract fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align native initialization and contracts with 2.6
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/Sentinel Mac 2\.5/Sentinel Mac 2.6/g; s/Sentinel 2\.5/Sentinel 2.6/g; s/2\.4 Native Frontend/2.6 Native Frontend/g' desktop/SentinelDesktop.swift
          perl -0pi -e 's/same 2\.4 product URL/same 2.6 product URL/g' build-desktop-macos.sh
          perl -0pi -e 's/Sentinel 2\.5/Sentinel 2.6/g; s/Sentinel 2\.4/Sentinel 2.6/g; s/2\.5 Native Frontend/2.6 Native Frontend/g; s/2\.4 Native Frontend/2.6 Native Frontend/g; s/2\.4-native/2.6-native/g' desktop_conversion_test.go manual_product_contract_test.go scan_center_contract_test.go snapshot_contract_test.go web_handler_runtime_test.go
          git diff --exit-code && { echo 'Expected Sentinel 2.6 alignment changes were not produced.' >&2; exit 1; } || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/SentinelDesktop.swift build-desktop-macos.sh desktop_conversion_test.go manual_product_contract_test.go scan_center_contract_test.go snapshot_contract_test.go web_handler_runtime_test.go
          git commit -m 'Align Sentinel 2.6 native initialization contracts'
          git push origin HEAD:main
