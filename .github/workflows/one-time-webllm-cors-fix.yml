name: One-time WebLLM CORS fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Install one-time WebLLM CORS fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace cross-origin WebLLM module source
        shell: bash
        run: |
          set -euo pipefail
          OLD='https://esm.run/@mlc-ai/web-llm@0.2.82'
          NEW='https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.82/lib/index.js'
          perl -0pi -e 's#https://esm\.run/\@mlc-ai/web-llm\@0\.2\.82#https://cdn.jsdelivr.net/npm/\@mlc-ai/web-llm\@0.2.82/lib/index.js#g' web/app/ai.js web/app/ai-worker.js
          perl -0pi -e 's#https://esm\.run#https://cdn.jsdelivr.net#g' main.go
          perl -0pi -e 's#Sentinel 2\.5 Local AI worker#Sentinel 2.6 Local AI worker#g' web/app/ai-worker.js
          git grep -F 'https://esm.run' -- web/app/ai.js web/app/ai-worker.js main.go && exit 1 || true
          grep -Fq "$NEW" web/app/ai.js
          grep -Fq "$NEW" web/app/ai-worker.js
          grep -Fq 'https://cdn.jsdelivr.net' main.go
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/ai.js web/app/ai-worker.js main.go
          git commit -m 'Fix WebLLM CORS loading in native App View'
          git push origin HEAD:main
