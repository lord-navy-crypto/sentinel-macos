name: One-time Runtime Logs migration

on:
  push:
    branches:
      - sentinel-2.7-runtime-logs
    paths:
      - .github/workflows/one-time-runtime-logs.yml
      - tools/one_time_runtime_logs.py
      - tools/one_time_runtime_logs_builder.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-2.7-runtime-logs
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Patch Runtime Logs integration
        run: |
          python3 tools/one_time_runtime_logs.py
          python3 tools/one_time_runtime_logs_builder.py
      - name: Validate patched source
        run: |
          git diff --check
          gofmt -w runtime_logs.go
          node --check web/app/runtime-logs.js
          node --check web/app/ai.js
          bash -n build-desktop-macos.sh
          grep -Fq '/api/runtime/logs' main.go
          grep -Fq '/app/runtime-logs.js' web/index.html
          grep -Fq 'init-progress' web/app/ai.js
          grep -Fq 'Runtime Logs' web/app/runtime-logs.js
          grep -Fq 'RUNTIME_LOGS_MARKER' build-desktop-macos.sh
      - name: Validate contracts and desktop package
        run: |
          go test ./...
          go vet ./...
          chmod +x build-desktop-macos.sh build-macos.sh
          ./build-desktop-macos.sh
          test -d dist/Sentinel.app
          for engine in dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-arm64 dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-x86_64; do
            LC_ALL=C grep -aFq 'Sentinel 2.7 Runtime Logs' "$engine"
            LC_ALL=C grep -aFq '/api/runtime/logs' "$engine"
            LC_ALL=C grep -aFq 'init-progress' "$engine"
          done
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.go runtime_logs.go web/index.html web/app/runtime-logs.js web/app/ai.js build-desktop-macos.sh desktop_conversion_test.go product_frontend_contract_helpers_test.go web_wiring_test.go
          git commit -m 'Add complete Runtime Logs view'
          git push origin HEAD:sentinel-2.7-runtime-logs
