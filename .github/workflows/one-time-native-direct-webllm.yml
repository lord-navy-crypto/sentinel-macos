name: One-time Native direct WebLLM migration

on:
  push:
    branches:
      - sentinel-2.7-native-direct-webllm
    paths:
      - .github/workflows/one-time-native-direct-webllm.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-2.7-native-direct-webllm
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Patch Native Local AI execution path
        run: python3 tools/one_time_native_direct_webllm.py
      - name: Validate patched source
        run: |
          git diff --check
          node --check web/app/ai.js
          node --check web/app/ai-reliability.js
          bash -n build-desktop-macos.sh
          grep -Fq "useIndexedDBCache:false" web/app/ai.js
          grep -Fq "CreateMLCEngine" web/app/ai.js
          grep -Fq "CreateWebWorkerMLCEngine" web/app/ai.js
          grep -Fq "__sentinelNativeAppView" desktop/SentinelDesktop.swift
          test -z "$(grep -F "cacheBackend:'cache'" web/app/ai.js || true)"
      - name: Validate contracts and desktop package
        run: |
          go test ./...
          go vet ./...
          chmod +x build-desktop-macos.sh build-macos.sh
          ./build-desktop-macos.sh
          test -d dist/Sentinel.app
          for engine in dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-arm64 dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-x86_64; do
            LC_ALL=C grep -aFq 'useIndexedDBCache:false' "$engine"
            LC_ALL=C grep -aFq '__sentinelNativeAppView' "$engine"
            LC_ALL=C grep -aFq 'CreateMLCEngine' "$engine"
          done
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/ai.js web/app/ai-reliability.js desktop/SentinelDesktop.swift desktop_conversion_test.go local_ai_contract_test.go build-desktop-macos.sh .github/workflows/ci.yml
          git commit -m 'Use direct WebLLM engine in Native App View'
          git push origin HEAD:sentinel-2.7-native-direct-webllm
