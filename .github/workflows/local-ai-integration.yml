name: Apply Local AI integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-ai-integration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded WebLLM and App View changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('main.go')
          s = main.read_text()
          old = '''w.Header().Set("Content-Security-Policy", "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'")'''
          new = '''w.Header().Set("Content-Security-Policy", "default-src 'self'; style-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://esm.run; worker-src 'self' blob:; connect-src 'self' https://esm.run https://huggingface.co https://*.huggingface.co https://*.hf.co https://*.xethub.hf.co https://raw.githubusercontent.com; img-src 'self' data:; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'")'''
          if old not in s:
              raise SystemExit('expected Sentinel CSP line was not found')
          s = s.replace(old, new, 1)
          main.write_text(s)

          swift = Path('desktop/SentinelDesktop.swift')
          s = swift.read_text()
          old = '        config.websiteDataStore = .nonPersistent()'
          new = '''        // Local AI uses WebLLM IndexedDB for multi-gigabyte model artifacts.\n        // Persist the localhost WebKit store so an explicitly downloaded model\n        // survives App View relaunch instead of being downloaded every time.\n        config.websiteDataStore = .default()'''
          if old not in s:
              raise SystemExit('expected nonPersistent WKWebsiteDataStore line was not found')
          s = s.replace(old, new, 1)
          s = s.replace('Sentinel Mac 2.4', 'Sentinel Mac 2.5')
          s = s.replace('Sentinel 2.4 product interface', 'Sentinel 2.5 product interface')
          s = s.replace('Sentinel 2.4 Native Frontend', 'Sentinel 2.5 Native Frontend')
          s = s.replace('Sentinel 2.4 · Local Evidence', 'Sentinel 2.5 · Local Evidence')
          swift.write_text(s)
          PY

      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.go desktop/SentinelDesktop.swift
          git diff --cached --check
          git commit -m 'Enable persistent WebLLM in native App View'
          git push origin HEAD:main
