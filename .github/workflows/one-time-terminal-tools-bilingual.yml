name: One-time Manual bilingual companion validation

on:
  push:
    branches:
      - sentinel-2.8-terminal-tools-bilingual-impl
    paths:
      - .github/workflows/one-time-terminal-tools-bilingual.yml
      - tools/one_time_manual_bilingual_companion.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-2.8-terminal-tools-bilingual-impl
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Apply Manual bilingual companion
        run: python3 tools/one_time_manual_bilingual_companion.py
      - name: Validate Manual and product contracts
        run: |
          git diff --check
          node --check web/app/manual.js
          node --check web/app/manual-entry.js
          go test ./... -run 'Manual|Bilingual|CanonicalSystemPromotesVisualTerminalTools|ApplicationRegistersEveryDeclaredLens|APIReferencesHaveRegisteredRoutes'
          go vet ./...
          grep -Fq 'English companion / 英文说明' web/app/manual.js
          grep -Fq 'data-manual-language="en"' web/app/manual.js
      - name: Full repository and desktop package
        run: |
          go test ./...
          chmod +x build-desktop-macos.sh
          ./build-desktop-macos.sh
          test -d dist/Sentinel.app
          for engine in dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-arm64 dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-x86_64; do
            LC_ALL=C grep -aFq 'English companion / 英文说明' "$engine"
            LC_ALL=C grep -aFq 'Terminal Tools / 终端工具' "$engine"
          done
      - name: Commit validated Manual changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/manual.js manual_product_contract_test.go
          git commit -m 'Add bilingual companion to every Manual topic'
          git push origin HEAD:sentinel-2.8-terminal-tools-bilingual-impl
