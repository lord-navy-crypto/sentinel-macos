name: One-time Terminal Tools and bilingual UX migration

on:
  push:
    branches:
      - sentinel-2.8-terminal-tools-bilingual-impl
    paths:
      - .github/workflows/one-time-terminal-tools-bilingual.yml
      - tools/one_time_terminal_tools_bilingual.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-2.8-terminal-tools-bilingual-impl
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Apply product balance migration
        run: |
          python3 tools/one_time_terminal_tools_bilingual.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ('QUICK_START.md','GUIDE.md','docs/PRODUCT_BALANCE_AUDIT.md'):
              p=Path(name)
              p.write_text('\n'.join(line.rstrip() for line in p.read_text().splitlines())+'\n')
          PY
      - name: Validate source and contracts
        run: |
          git diff --check
          node --check web/app/core.js
          node --check web/app/lenses/system.js
          go test ./... -run 'CanonicalSystemPromotesVisualTerminalTools|PrimaryUsageDocsAreBilingual|TerminalBackendRemainsTypedBoundedAndNoShell|SystemConsole|Navigation|Manual'
          go vet ./...
          grep -Fq 'Terminal Tools / 终端工具' web/app/core.js
          grep -Fq 'Equivalent command / 等价命令' web/app/lenses/system.js
          grep -Fq 'Product Balance Audit / 产品重心审计' docs/PRODUCT_BALANCE_AUDIT.md
      - name: Full repository and desktop package
        run: |
          go test ./...
          chmod +x build-desktop-macos.sh
          ./build-desktop-macos.sh
          test -d dist/Sentinel.app
          for engine in dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-arm64 dist/Sentinel.app/Contents/Resources/bin/sentinel-macos-x86_64; do
            LC_ALL=C grep -aFq 'Terminal Tools / 终端工具' "$engine"
            LC_ALL=C grep -aFq '/api/system/query/structured' "$engine"
            LC_ALL=C grep -aFq 'Equivalent command / 等价命令' "$engine"
          done
      - name: Commit validated product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/core.js web/app/lenses/system.js web/system-console.html QUICK_START.md GUIDE.md docs/PRODUCT_BALANCE_AUDIT.md bilingual_terminal_product_contract_test.go
          git commit -m 'Promote visual Terminal Tools and bilingual user guidance'
          git push origin HEAD:sentinel-2.8-terminal-tools-bilingual-impl
